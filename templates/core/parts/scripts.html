<script>
  const tabSections = document.querySelectorAll(".tab-section");
  const navButtons = document.querySelectorAll(".nav-btn");

  function setTab(tab, push=true) {
    tabSections.forEach(s => s.classList.add("hidden"));
    const el = document.getElementById(`tab-${tab}`);
    if (el) el.classList.remove("hidden");

    navButtons.forEach(b => {
      const isActive = b.dataset.tab === tab;
      b.classList.toggle("text-primary", isActive);
      b.classList.toggle("text-slate-400", !isActive);
    });

    if (push) {
      const url = new URL(window.location.href);
      url.searchParams.set("tab", tab);
      window.history.pushState({}, "", url.toString());
    }
  }

  navButtons.forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab, true));
  });

  window.addEventListener("popstate", () => {
    const url = new URL(window.location.href);
    setTab(url.searchParams.get("tab") || "home", false);
  });

  setTab("{{ initial_tab|default:'home' }}", false);

  // Modal
  const postModal = document.getElementById("postModal");
  const postModalBody = document.getElementById("postModalBody");

  function openPostModal(postId) {
    postModalBody.textContent = "読み込み中...";
    postModal.classList.remove("hidden");

    fetch(`/posts/${postId}/json/`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        // まずはpostModalBodyだけで完結（title/detail要素分けは後でOK）
        postModalBody.innerHTML = `
          <div class="text-sm font-bold">${escapeHtml(data.title ?? "")}</div>
          <div class="mt-1 text-xs text-slate-500">${escapeHtml(data.circle_name ?? "")}</div>
          <div class="mt-3 text-sm whitespace-pre-wrap">${escapeHtml(data.detail ?? "")}</div>
          <div class="mt-3 text-xs text-slate-500">日時: ${escapeHtml(data.event_at ?? "")}</div>
          <div class="mt-1 text-xs text-slate-500">場所: ${escapeHtml(data.place ?? "")}</div>
        `;
      })
      .catch(err => {
        console.error("openPostModal failed:", err);
        postModalBody.textContent = "詳細取得に失敗しました: " + err;
      });
  }

  // innerHTML使うので最低限のエスケープ
  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function closePostModal() {
    postModal.classList.add("hidden");
    postModalBody.textContent = "";
  }

  function toggleFavorite(postId) {
    alert("保存（favorite）はまだ未実装です: " + postId);
  }
  function openConversation(id) { alert("会話: " + id); }
</script>
