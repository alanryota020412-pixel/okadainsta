<script>
  const tabSections = document.querySelectorAll(".tab-section");
  const navButtons = document.querySelectorAll(".nav-btn");

  function setTab(tab, push = true) {
    tabSections.forEach(s => s.classList.add("hidden"));

    // 1) まず tab-{tab} を探す（例: tab-profile_edit）
    let el = document.getElementById(`tab-${tab}`);

    // 2) 無ければ '_' を '-' に変換して探す（例: tab-profile-edit）
    if (!el) {
      const normalized = String(tab).replaceAll("_", "-");
      el = document.getElementById(`tab-${normalized}`);
    }

    if (el) el.classList.remove("hidden");

    navButtons.forEach(b => {
      const isActive = b.dataset.tab === tab;
      b.classList.toggle("text-primary", isActive);
      b.classList.toggle("text-slate-400", !isActive);
    });

    if (push) {
      const url = new URL(window.location.href);
      url.searchParams.set("tab", tab);
      window.history.pushState({}, "", url.toString());
    }
  }

  navButtons.forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab, true));
  });

  window.addEventListener("popstate", () => {
    const url = new URL(window.location.href);
    setTab(url.searchParams.get("tab") || "home", false);
  });

  setTab("{{ initial_tab|default:'home' }}", false);

  const postModal = document.getElementById("postModal");
  const postModalBody = document.getElementById("postModalBody");

  function buildModalSliderHtml(urls) {
    if (!urls || urls.length === 0) return "";

    const slides = urls.map(src => `
    <button type="button" class="flex-none basis-full snap-start" data-src="${src}">
      <div class="relative w-full aspect-[4/5]">
        <img class="absolute inset-0 w-full h-full object-cover" src="${src}" alt="post image" loading="lazy">
      </div>
    </button>
  `).join("");

    const nav = (urls.length > 1) ? `
    <button type="button"
      class="js-prev absolute left-2 top-1/2 -translate-y-1/2 z-10 md:flex
            items-center justify-center w-10 h-10 rounded-full
            bg-black/30 hover:bg-black/50 text-white
            opacity-0 group-hover:opacity-100 transition"
      aria-label="prev">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>
    <button type="button"
      class="js-next absolute right-2 top-1/2 -translate-y-1/2 z-10 md:flex
            items-center justify-center w-10 h-10 rounded-full
            bg-black/30 hover:bg-black/50 text-white
            opacity-0 group-hover:opacity-100 transition"
      aria-label="next">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
  ` : "";

    return `
    <div class="pt-2 mb-3">
      <div class="relative group z-10">
        <div class="js-slider flex overflow-x-auto scroll-smooth snap-x snap-proximity
                    [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden"
             data-open-modal="1">
          ${slides}
          <span style="flex: 0 0 8px;"></span>
        </div>
        ${nav}
      </div>
    </div>
  `;
  }

  function openPostModal(postId) {
    postModalBody.textContent = "読み込み中...";
    postModal.classList.remove("hidden");

    fetch(`/posts/${postId}/json/`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        const urls = data.image_urls || data.images || []; // ←APIに合わせてどっちかに統一

        const sliderHtml = buildModalSliderHtml(urls);

        postModalBody.innerHTML = `
          ${sliderHtml}
          <div class="text-sm font-bold">${escapeHtml(data.title ?? "")}</div>
          <div class="mt-1 text-xs text-slate-500">${escapeHtml(data.circle_name ?? "")}</div>
          <div class="mt-3 text-sm whitespace-pre-wrap">${escapeHtml(data.detail ?? "")}</div>
          <div class="mt-3 text-xs text-slate-500">日時: ${escapeHtml(data.event_at ?? "")}</div>
          <div class="mt-1 text-xs text-slate-500">場所: ${escapeHtml(data.place ?? "")}</div>
        `;

        // ✅ ここ（DOM差し込み直後）が正解
        window.initSliders?.(postModalBody);
      })
      .catch(err => {
        console.error("openPostModal failed:", err);
        postModalBody.textContent = "詳細取得に失敗しました: " + err;
      });
  }


  // innerHTML使うので最低限のエスケープ
  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function closePostModal() {
    postModal.classList.add("hidden");
    postModalBody.textContent = "";
  }

  function toggleFavorite(postId) {
    alert("保存（favorite）はまだ未実装です: " + postId);
  }

  // --- 画像アップロード：選択したらプレビュー表示（複数枚対応） ---
  (function () {
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("imagePreview");
    const prompt = document.getElementById("uploadPrompt");
    const thumbs = document.getElementById("thumbs");
    if (!input || !preview || !thumbs || !prompt) return;

    input.addEventListener("change", () => {
      const files = Array.from(input.files || []);
      thumbs.innerHTML = ""; // クリア

      if (files.length === 0) {
        preview.src = "";
        preview.classList.add("hidden");
        prompt.classList.remove("hidden");
        thumbs.classList.add("hidden");
        return;
      }

      // エラーチェック（5MB）
      const maxBytes = 5 * 1024 * 1024;
      const oversized = files.some(f => f.size > maxBytes);
      if (oversized) {
        alert("5MBを超える画像が含まれています。");
        input.value = "";
        preview.classList.add("hidden");
        prompt.classList.remove("hidden");
        thumbs.classList.add("hidden");
        return;
      }

      // メインプレビュー（最初の1枚）
      preview.src = URL.createObjectURL(files[0]);
      preview.classList.remove("hidden");
      prompt.classList.add("hidden");

      // サムネイル一覧
      if (files.length > 1) {
        thumbs.classList.remove("hidden");
        files.forEach(file => {
          const div = document.createElement("div");
          div.className = "shrink-0 w-16 aspect-square rounded-lg overflow-hidden border border-white/30";
          const img = document.createElement("img");
          img.src = URL.createObjectURL(file);
          img.className = "w-full h-full object-cover";
          div.appendChild(img);
          thumbs.appendChild(div);
        });
      } else {
        thumbs.classList.add("hidden");
      }
    });
  })();


  function openConversation(id) { alert("会話: " + id); }
  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".js-slider").forEach((slider) => {
      const wrapper = slider.closest(".group") || slider.parentElement;
      const prev = wrapper?.querySelector(".js-prev");
      const next = wrapper?.querySelector(".js-next");
      if (!prev || !next) return;

      const items = Array.from(slider.children); // ← slider直下のbuttonたち
      const n = items.length;
      if (n <= 1) return;

      let index = 0;

      const maxLeft = () => Math.max(0, slider.scrollWidth - slider.clientWidth);

      const syncIndex = () => {
        // 現在のscrollLeftに一番近いoffsetLeftをindexとして採用（ズレ補正）
        const x = slider.scrollLeft;
        let best = 0, bestDist = Infinity;
        for (let i = 0; i < n; i++) {
          const d = Math.abs(items[i].offsetLeft - x);
          if (d < bestDist) { bestDist = d; best = i; }
        }
        index = best;
      };

      const go = (to) => {
        index = Math.max(0, Math.min(n - 1, to));

        // 目標位置：基本は対象要素のoffsetLeft
        let left = items[index].offsetLeft;

        // 最後の要素はstartに揃えられないことがあるので maxScrollLeft に吸い付ける
        if (index === n - 1) left = maxLeft();

        // 念のためクランプ
        left = Math.max(0, Math.min(maxLeft(), left));

        slider.scrollTo({ left, behavior: "smooth" });
      };

      // ユーザーがスワイプした時もindexを追従
      slider.addEventListener("scroll", () => {
        // scroll中に更新しすぎない（軽量に）
        window.clearTimeout(slider.__t);
        slider.__t = window.setTimeout(syncIndex, 80);
      }, { passive: true });

      prev.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation();
        syncIndex();
        go(index - 1);
      });

      next.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation();
        syncIndex();
        go(index + 1);
      });
    });
  });

</script>

<script>
  const circleModal = document.getElementById("circleModal");
  const circleModalTitle = document.getElementById("circleModalTitle");
  const circleModalBody = document.getElementById("circleModalBody");
  const circleModalLinks = document.getElementById("circleModalLinks");

  function closeCircleModal() {
    circleModal.classList.add("hidden");
    circleModalTitle.textContent = "";
    circleModalBody.textContent = "";
    circleModalLinks.innerHTML = "";
  }

  async function openCircleProfile(profileId) {
    try {
      const res = await fetch(`/api/profiles/${profileId}/`);
      const data = await res.json();
      if (!data.ok) throw new Error("api error");

      const p = data.profile;
      circleModalTitle.textContent = p.circle_name || "サークル";

      const lines = [];
      if (p.bio) lines.push(p.bio);
      if (p.place || p.frequency) lines.push(`📍 ${p.place || ""}  /  🗓️ ${p.frequency || ""}`);
      circleModalBody.textContent = lines.join("\n");

      const links = [];
      if (p.x_url) links.push(`<a class="text-primary underline" href="${p.x_url}" target="_blank" rel="noopener">Xを見る</a>`);
      if (p.instagram_url) links.push(`<a class="text-primary underline" href="${p.instagram_url}" target="_blank" rel="noopener">Instagramを見る</a>`);
      circleModalLinks.innerHTML = links.length ? links.join("<br>") : `<span class="text-slate-400">SNSリンクなし</span>`;

      circleModal.classList.remove("hidden");
    } catch (e) {
      alert("サークル情報の取得に失敗しました");
      console.error(e);
    }
  }
</script>

<script>
  function openCircleProfile(profileId) {
    location.href = '/?tab=profile&circle_id=${circleId}';
    const url = new URL(window.location.href);
    url.searchParams.set("tab", "profile");
    url.searchParams.set("profile_id", profileId);
    window.location.href = url.toString();
  }
</script>
