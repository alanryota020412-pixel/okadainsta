<!DOCTYPE html>
<html class="dark" lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Circle Room - 新規登録</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0dccf2",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }

        /* Django forms custom styling helpers */
        .form-input-custom {
            @apply flex w-full rounded-xl text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-[#315f68] bg-white dark:bg-[#182f34] focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-[#90c1cb]/50 px-4 text-base font-normal transition-all;
        }

        ul.errorlist {
            @apply text-red-400 text-xs mt-1 space-y-1;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display antialiased">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <!-- Header / Logo Area -->
        <div class="flex flex-col items-center justify-center pt-10 pb-6 px-4">
            <div
                class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-primary shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-background-dark text-4xl">person_add</span>
            </div>
            <h1 class="text-gray-900 dark:text-white tracking-tight text-[28px] font-bold leading-tight text-center">
                アカウント作成
            </h1>
            <p class="mt-1 text-gray-500 dark:text-[#90c1cb] text-sm font-medium">Circle Room へようこそ</p>
        </div>

        <!-- Signup Form Section -->
        <div class="flex flex-col w-full max-w-[480px] mx-auto px-6 pb-20">
            <form method="post" class="space-y-4">
                {% csrf_token %}

                {% for field in form %}
                <div class="flex flex-col gap-1.5">
                    <label class="flex flex-col w-full">
                        <p class="text-gray-700 dark:text-white text-sm font-semibold leading-normal pb-1 px-1">{{
                            field.label }}</p>
                        <div class="relative">
                            <input name="{{ field.name }}" type="{{ field.field.widget.input_type|default:'text' }}"
                                class="form-input flex w-full rounded-xl text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-[#315f68] bg-white dark:bg-[#182f34] focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-[#90c1cb]/50 px-4 text-sm font-normal transition-all"
                                {% if field.field.required %}required{% endif %}>
                        </div>
                        {% if field.help_text %}
                        <p class="text-xs text-gray-400 dark:text-[#90c1cb]/60 mt-1 px-1 leading-relaxed">
                            {{ field.help_text|safe }}
                        </p>
                        {% endif %}
                        {{ field.errors }}
                    </label>
                </div>
                {% endfor %}

                <!-- Signup Button -->
                <div class="pt-4">
                    <button type="submit"
                        class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-background-dark text-base font-bold leading-normal tracking-wide shadow-lg shadow-primary/10 active:scale-[0.98] transition-transform">
                        <span class="truncate">登録してログイン</span>
                    </button>
                </div>
            </form>

            <div class="flex items-center py-4">
                <div class="flex-grow border-t border-gray-200 dark:border-gray-800"></div>
                <span class="px-3 text-xs text-gray-400 dark:text-[#90c1cb]/50 uppercase tracking-widest">or</span>
                <div class="flex-grow border-t border-gray-200 dark:border-gray-800"></div>
            </div>

            <div class="flex flex-col items-center gap-2 pt-2">
                <p class="text-gray-500 dark:text-[#90c1cb] text-sm font-normal">すでにアカウントをお持ちですか？</p>
                <a href="{% url 'login' %}" class="text-primary text-base font-bold hover:underline py-1">
                    ログインする
                </a>
            </div>
        </div>

        <!-- Background Decoration -->
        <div class="fixed -bottom-24 -left-24 h-64 w-64 rounded-full bg-primary/10 blur-[100px] pointer-events-none">
        </div>
        <div class="fixed -top-24 -right-24 h-64 w-64 rounded-full bg-primary/5 blur-[80px] pointer-events-none"></div>
    </div>
</body>

</html>
