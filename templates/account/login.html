<!DOCTYPE html>
<html class="dark" lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Circle Room - ログイン</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0dccf2",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display antialiased">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <!-- Header / Logo Area -->
        <div class="flex flex-col items-center justify-center pt-10 pb-6 px-4">
            <div
                class="mb-4 flex h-20 w-20 items-center justify-center rounded-2xl bg-primary shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-background-dark text-5xl">diversity_3</span>
            </div>
            <h1 class="text-gray-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">
                Circle Room
            </h1>
            <p class="mt-2 text-gray-500 dark:text-[#90c1cb] text-base font-medium">サークル・新歓掲示板</p>
        </div>

        <!-- Login Card Section -->
        <div class="flex flex-col w-full max-w-[480px] mx-auto px-6 pb-20">

            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                <div
                    class="p-4 rounded-xl {% if message.tags == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20{% else %}bg-primary/10 text-primary border border-primary/20{% endif %} text-sm font-medium">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Google Login Button ONLY -->
            <div class="flex flex-col items-center gap-4 py-8">
                {% load socialaccount %}
                <a href="{% provider_login_url 'google' %}"
                    class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-16 px-5 bg-white border border-gray-300 dark:border-[#315f68] dark:bg-[#182f34] text-gray-900 dark:text-white text-lg font-bold leading-normal tracking-wide shadow-lg hover:bg-gray-50 dark:hover:bg-[#1c363c] active:scale-[0.98] transition-all mb-4">
                    <svg class="w-6 h-6 mr-3" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="currentColor"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="currentColor"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="currentColor"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Googleでログイン
                </a>
                <p class="text-gray-500 dark:text-[#90c1cb] text-sm font-normal text-center">
                    大学のアカウント、または個人の Google アカウントで<br>ログインしてください。
                </p>
            </div>
        </div>

        <!-- Background Decoration -->
        <div class="fixed -bottom-24 -left-24 h-64 w-64 rounded-full bg-primary/10 blur-[100px] pointer-events-none">
        </div>
        <div class="fixed -top-24 -right-24 h-64 w-64 rounded-full bg-primary/5 blur-[80px] pointer-events-none"></div>
    </div>
</body>

</html>
